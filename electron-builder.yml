appId: com.usage-widget.app
productName: AI Usage Widget
copyright: Copyright (c) 2026

directories:
  output: dist
  buildResources: assets

files:
  - src/**/*
  - collector/**/*
  - assets/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  icon: assets/icon.ico

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: assets/icon.icns
  category: public.app-category.utilities

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: assets/icon.png
  category: Utility

publish: null
